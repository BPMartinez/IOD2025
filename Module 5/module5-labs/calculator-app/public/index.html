<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Calculator App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <div class="calculator-container">
    <h1>Server-side Calculator</h1>

    <div class="calc-form">
      <div class="input-group">
        <label for="num1">Number 1</label>
        <input type="number" id="num1" placeholder="Enter first number" />
      </div>

      <div class="input-group">
        <label for="num2">Number 2</label>
        <input type="number" id="num2" placeholder="Enter second number" />
      </div>

      <div class="input-group">
        <label for="operation">Operation</label>
        <select id="operation">
          <option value="add">Add (+)</option>
          <option value="subtract">Subtract (-)</option>
          <option value="multiply">Multiply (×)</option>
          <option value="divide">Divide (÷)</option>
        </select>
      </div>

      <button id="calculateBtn">Calculate</button>
    </div>

    <div class="result-box">
      <h2>Result</h2>
      <p id="resultText">No calculation yet.</p>
    </div>

    <div class="extra-box">
      <h2>Random Number (Extension)</h2>
      <div class="input-group">
        <label for="min">Min (optional)</label>
        <input type="number" id="min" placeholder="Default is 0" />
      </div>
      <div class="input-group">
        <label for="max">Max</label>
        <input type="number" id="max" placeholder="Enter max value" />
      </div>
      <button id="randomBtn">Get Random Number</button>
      <p id="randomResult">No random number yet.</p>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
