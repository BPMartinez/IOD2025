<body>

  <header>
    <h1>Family Home</h1>
    <div class="user-info">

  <main>
    <div class="top-buttons">
 <ul>
       <button class="btn-primary" onclick="window.location.href='forms.html'">
  Request Playdate / Carpool
</button>

<button class="btn-secondary" onclick="window.location.href='participant-request.html'">
  View My Requests
</button>

<button class="btn-light" onclick="location.reload()">
  Refresh
</button>

<button class="btn-light" onclick="window.location.href='contact.html'">
  Contacts
</button>
</ul>

    <div class="columns">
      <!-- Connections Column -->
      <section class="column">
        <h2>My Connections</h2>
        <p class="small-text">
          These are families who share your school / group code.
          You can send playdate and carpool requests to them.
        </p>
        <ul id="connectionsList" class="connections-list"></ul>
      </section>

      <!-- Events Column -->
      <section class="column">
        <h2>Upcoming Events</h2>
        <p class="small-text">
          Post and see events shared by families at your school or in your group
          (park meetups, school events, practice times, etc.).
        </p>

        <!-- Event Form -->
        <form id="eventForm" class="event-form">
          <label for="eventTitle">Event Title</label>
          <input type="text" id="eventTitle" required placeholder="e.g. Playground Meetup" />

          <label for="eventDate">Date</label>
          <input type="date" id="eventDate" />

          <label for="eventLocation">Location</label>
          <input type="text" id="eventLocation" placeholder="e.g. Oak Hill Park" />

          <label for="eventDescription">Description</label>
          <textarea id="eventDescription" placeholder="Time, details, what to bring, etc."></textarea>

          <button type="submit">Post Event</button>
        </form>

        <!-- Event Feed -->
        <div id="eventsFeed" style="margin-top: 12px;"></div>
      </section>
    </div>
  </main>

 <script>
  (function () {
    const API_BASE_URL = "http://localhost:5000/api";

    function getToken() {
      return localStorage.getItem("authToken");
    }

    function getCurrentUserFromStorage() {
      const raw = localStorage.getItem("currentUser");
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function ensureLoggedIn() {
      const user = getCurrentUserFromStorage();
      const token = getToken();
      if (!user || !token) {
        alert("Please log in first.");
        window.location.href = "auth.html";
        return null;
      }
      return { user, token };
    }

    const auth = ensureLoggedIn();
    if (!auth) return;
    const { user, token } = auth;
    const currentUser = user;

    // ===== Fill in header user info =====
    document.getElementById("userFamilyName").textContent =
      currentUser.familyName || "Family";
    document.getElementById("userEmail").textContent =
      "Email: " + (currentUser.email || "");
    document.getElementById("userSchoolCode").textContent =
      "School / Group Code: " + (currentUser.schoolCode || "N/A");

    // ===== Logout =====
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("authToken");
      localStorage.removeItem("currentUser");
      localStorage.removeItem("currentUserEmail");
      window.location.href = "auth.html";
    });

    // ===== Connections (still using local demo data) =====
    function getUsersLocal() {
      return JSON.parse(localStorage.getItem("users")) || [];
    }

    const connectionsListEl = document.getElementById("connectionsList");

    function renderConnections() {
      const users = getUsersLocal();
      connectionsListEl.innerHTML = "";

      const connections = Array.isArray(currentUser.connections)
        ? currentUser.connections
        : [];

      if (connections.length === 0) {
        connectionsListEl.innerHTML =
          "<li>No connections yet. Share your code with other families at your school.</li>";
        return;
      }

      connections.forEach(email => {
        const otherUser = users.find(u => u.email === email);
        const li = document.createElement("li");
        if (otherUser) {
          li.textContent = `${otherUser.familyName || "Family"} — ${otherUser.email}`;
        } else {
          li.textContent = email;
        }
        connectionsListEl.appendChild(li);
      });
    }

    // ===== Events via backend =====
    const eventForm = document.getElementById("eventForm");
    const eventsFeedEl = document.getElementById("eventsFeed");

    async function fetchEvents() {
      const res = await fetch(`${API_BASE_URL}/events`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });
      if (!res.ok) {
        throw new Error("Failed to load events");
      }
      return res.json();
    }

    function formatDate(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      if (Number.isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString();
    }

    async function renderEvents() {
      eventsFeedEl.innerHTML = "<p class='no-events'>Loading events...</p>";
      try {
        const events = await fetchEvents();

        eventsFeedEl.innerHTML = "";

        if (!events.length) {
          const p = document.createElement("p");
          p.className = "no-events";
          p.textContent =
            "No events posted yet. Be the first to post something for your school or group!";
          eventsFeedEl.appendChild(p);
          return;
        }

        const sorted = [...events].sort(
          (a, b) => new Date(b.createdAt) - new Date(a.createdAt)
        );

        sorted.forEach(ev => {
          const div = document.createElement("div");
          div.className = "event-card";

          const title = document.createElement("h3");
          title.textContent = ev.title || "Untitled Event";

          const meta = document.createElement("div");
          meta.className = "event-meta";
          const by = ev.createdBy && ev.createdBy.familyName
            ? ev.createdBy.familyName
            : "Another family";
          const datePart = ev.date ? formatDate(ev.date) : "No date";
          const locPart = ev.location || "";
          meta.textContent = `${datePart}${locPart ? " • " + locPart : ""} • Posted by ${by}`;

          const desc = document.createElement("div");
          desc.className = "event-description";
          desc.textContent = ev.description || "";

          div.appendChild(title);
          div.appendChild(meta);
          div.appendChild(desc);
          eventsFeedEl.appendChild(div);
        });
      } catch (err) {
        console.error(err);
        eventsFeedEl.innerHTML =
          "<p class='no-events'>Could not load events. Is the server running?</p>";
      }
    }

    eventForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const title = document.getElementById("eventTitle").value.trim();
      const date = document.getElementById("eventDate").value;
      const location = document.getElementById("eventLocation").value.trim();
      const description = document.getElementById("eventDescription").value.trim();

      if (!title) {
        alert("Please enter an event title.");
        return;
      }

      try {
        const res = await fetch(`${API_BASE_URL}/events`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({ title, date, location, description })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          alert(data.message || "Could not save event.");
          return;
        }

        eventForm.reset();
        await renderEvents();
      } catch (err) {
        console.error(err);
        alert("Error contacting server while saving event.");
      }
    });

    // Initial render
    renderConnections();
    renderEvents();
  })();
</script>
